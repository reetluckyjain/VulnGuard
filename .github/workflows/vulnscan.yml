name: VulnGuard Security Scan

on:
  repository_dispatch:
    types: [vulnscan]

timeout-minutes: 5

jobs:
  vulnscan:
    runs-on: ubuntu-latest
    env:
      SCAN_ID: ${{ github.event.client_payload.scan_id }}
      SCAN_TYPE: ${{ github.event.client_payload.scan_type }}
      TARGET: ${{ github.event.client_payload.target }}
      PORT: ${{ github.event.client_payload.port || '80' }}
      CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
      CALLBACK_SECRET: ${{ github.event.client_payload.callback_secret }}

    steps:
      # ── Configure target URL based on port ──────────────────────────────────
      - name: Configure target URL
        run: |
          if [ "$PORT" = "443" ]; then
            echo "TARGET_URL=https://$TARGET:$PORT" >> "$GITHUB_ENV"
          else
            echo "TARGET_URL=http://$TARGET:$PORT" >> "$GITHUB_ENV"
          fi
          echo "Target: $TARGET | Port: $PORT | URL: $( [ "$PORT" = "443" ] && echo "https://$TARGET:$PORT" || echo "http://$TARGET:$PORT" )"

      # ── Install scanner tools ───────────────────────────────────────────────
      - name: Install scanner tools
        run: |
          echo "Installing nmap and nikto via apt..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq nmap nikto

          echo "Installing nuclei via Go..."
          go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest

          # Add Go bin to PATH for subsequent steps
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

          # Download nuclei templates (needed for scan step)
          echo "Downloading nuclei templates..."
          "$HOME/go/bin/nuclei" -update-templates

          echo "All scanner tools installed successfully."

      # ── Execute scan ────────────────────────────────────────────────────────
      - name: Execute scan
        id: scan
        run: |
          set +e  # Don't exit on scanner errors — we still want to send callback

          echo "=========================================="
          echo "  VulnGuard Scan: $SCAN_TYPE"
          echo "  Target: $TARGET"
          echo "  Port: $PORT"
          echo "=========================================="

          case "$SCAN_TYPE" in
            nmap)
              echo "::group::Nmap Scan"
              nmap -sT -sV -F --top-ports 100 --max-retries 1 \
                --host-timeout 30s --min-rate 100 \
                -oX /tmp/nmap_results.xml "$TARGET"
              echo "::endgroup::"
              ;;

            nikto)
              echo "::group::Nikto Scan"
              nikto -h "$TARGET:$PORT" -Format csv \
                -o /tmp/nikto_results.csv \
                -nointeractive -C all -maxtime 60s
              echo "::endgroup::"
              ;;

            nuclei)
              echo "::group::Nuclei Scan"
              nuclei -u "$TARGET_URL" \
                -jle /tmp/nuclei_results.jsonl \
                -silent -timeout 5 -c 10 -rl 50 -retries 1 \
                -t ~/nuclei-templates/http/cves/ \
                -t ~/nuclei-templates/http/vulnerabilities/ \
                -t ~/nuclei-templates/http/exposures/ \
                -t ~/nuclei-templates/http/misconfiguration/
              echo "::endgroup::"
              ;;

            full)
              echo "::group::Full Scan (nmap + nikto + nuclei in parallel)"

              # Launch all three scanners as background processes
              nmap -sT -sV -F --top-ports 100 --max-retries 1 \
                --host-timeout 30s --min-rate 100 \
                -oX /tmp/nmap_results.xml "$TARGET" &
              NMAP_PID=$!

              nikto -h "$TARGET:$PORT" -Format csv \
                -o /tmp/nikto_results.csv \
                -nointeractive -C all -maxtime 60s &
              NIKTO_PID=$!

              nuclei -u "$TARGET_URL" \
                -jle /tmp/nuclei_results.jsonl \
                -silent -timeout 5 -c 10 -rl 50 -retries 1 \
                -t ~/nuclei-templates/http/cves/ \
                -t ~/nuclei-templates/http/vulnerabilities/ \
                -t ~/nuclei-templates/http/exposures/ \
                -t ~/nuclei-templates/http/misconfiguration/ &
              NUCLEI_PID=$!

              # Wait for all background processes to complete
              wait "$NMAP_PID";  NMAP_EXIT=$?
              wait "$NIKTO_PID"; NIKTO_EXIT=$?
              wait "$NUCLEI_PID"; NUCLEI_EXIT=$?

              echo "Nmap exit: $NMAP_EXIT | Nikto exit: $NIKTO_EXIT | Nuclei exit: $NUCLEI_EXIT"
              echo "::endgroup::"
              ;;

            *)
              echo "ERROR: Unknown scan type '$SCAN_TYPE'"
              echo "SCAN_ERROR=Unknown scan type: $SCAN_TYPE" >> "$GITHUB_ENV"
              ;;
          esac

          echo "Scan execution step completed."

      # ── Send results callback ───────────────────────────────────────────────
      - name: Send results callback
        if: always()
        run: |
          # ── Build JSON payload with Python (handles escaping reliably) ──
          python3 << 'PYEOF'
          import json
          import os

          scan_id = os.environ.get("SCAN_ID", "unknown")
          scan_type = os.environ.get("SCAN_TYPE", "nmap")
          target = os.environ.get("TARGET", "")
          port = os.environ.get("PORT", "80")
          callback_secret = os.environ.get("CALLBACK_SECRET", "")
          scan_error = os.environ.get("SCAN_ERROR", "")

          results = {}

          # ── Collect nmap results ──
          if scan_type in ("nmap", "full"):
              try:
                  with open("/tmp/nmap_results.xml", "r", errors="replace") as f:
                      results["nmap"] = {"raw": f.read()}
              except FileNotFoundError:
                  if scan_type == "nmap":
                      scan_error = scan_error or "nmap scan produced no output file"

          # ── Collect nikto results ──
          if scan_type in ("nikto", "full"):
              try:
                  with open("/tmp/nikto_results.csv", "r", errors="replace") as f:
                      results["nikto_raw"] = f.read()
              except FileNotFoundError:
                  if scan_type == "nikto":
                      scan_error = scan_error or "nikto scan produced no output file"

          # ── Collect nuclei results ──
          if scan_type in ("nuclei", "full"):
              try:
                  with open("/tmp/nuclei_results.jsonl", "r", errors="replace") as f:
                      results["nuclei_raw"] = f.read()
              except FileNotFoundError:
                  if scan_type == "nuclei":
                      scan_error = scan_error or "nuclei scan produced no output file"

          # Determine final status
          status = "Failed" if scan_error else "Completed"

          payload = {
              "scan_id": scan_id,
              "scan_type": scan_type,
              "target": target,
              "port": port,
              "status": status,
              "error": scan_error,
              "callback_secret": callback_secret,
              "results": results,
          }

          # Write payload to file for curl to POST
          with open("/tmp/callback_payload.json", "w") as f:
              json.dump(payload, f)

          print(f"Scan {scan_id}: {status}")
          if scan_error:
              print(f"Error: {scan_error}")
          print(f"Results keys: {list(results.keys())}")
          PYEOF

          # ── POST callback via curl ──
          if [ -n "$CALLBACK_URL" ]; then
            echo "Posting results to callback URL..."
            HTTP_CODE=$(curl -s -o /tmp/callback_response.txt -w "%{http_code}" \
              -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -d @/tmp/callback_payload.json \
              --max-time 30 \
              --retry 2 \
              --retry-delay 5)
            echo "Callback response: HTTP $HTTP_CODE"

            if [ "$HTTP_CODE" -ge 400 ] 2>/dev/null; then
              echo "Warning: Callback returned HTTP $HTTP_CODE"
              echo "Response body:"
              cat /tmp/callback_response.txt 2>/dev/null || true
            fi
          else
            echo "Warning: No callback URL provided — results not posted"
            echo "Payload saved to /tmp/callback_payload.json for debugging"
          fi
